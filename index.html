<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="module" src="index.js"></script>
  <title>Galaksi</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-image: url(img/2k_stars.jpg);
    }
    
    /* Bantuan AI */
    .planet-popup {
      position: absolute;
      bottom: 30px;
      left: 30px;
      width: 260px;
      padding: 16px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      border-radius: 12px;
      font-family: Arial, sans-serif;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      transition: all 0.4s ease;
    }

    .planet-popup h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .planet-popup p {
      margin: 0;
      font-size: 14px;
      line-height: 1.4;
    }

    .hidden {
      opacity: 0;
      transform: translateY(20px);
      pointer-events: none;
    }

    /* ---------------------- */

  </style>
</head>
<body>
  <div id="planetPopup" class="planet-popup hidden">
    <h2 id="planetName"></h2>
    <p id="planetDesc"></p>
  </div>
</body>
</html>
